<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donut Chart</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .chart-container {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .chart-body {
      display: flex;
      align-items: center;
      gap: 48px;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #333;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-label {
      font-weight: 500;
      min-width: 50px;
    }

    .legend-pct {
      color: #888;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h2>Workload Distribution</h2>
    <div class="chart-body">
      <svg id="donut" width="220" height="220" viewBox="0 0 220 220"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <script>
    const segments = [
      { label: "KTLO",  pct: 25, color: "#4F81E2" },
      { label: "Sales", pct: 25, color: "#34C97B" },
      { label: "Other", pct: 45, color: "#F4A429" },
    ];

    const cx = 110, cy = 110, R = 90, r = 54;
    const gap = 2; // gap in degrees between segments
    const total = segments.reduce((s, d) => s + d.pct, 0);

    function polarToXY(cx, cy, radius, angleDeg) {
      const rad = (angleDeg - 90) * Math.PI / 180;
      return [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
    }

    function arcPath(cx, cy, R, r, startDeg, endDeg) {
      const [x1, y1] = polarToXY(cx, cy, R, startDeg);
      const [x2, y2] = polarToXY(cx, cy, R, endDeg);
      const [x3, y3] = polarToXY(cx, cy, r, endDeg);
      const [x4, y4] = polarToXY(cx, cy, r, startDeg);
      const large = endDeg - startDeg > 180 ? 1 : 0;
      return `M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2}
              L ${x3} ${y3} A ${r} ${r} 0 ${large} 0 ${x4} ${y4} Z`;
    }

    const svg = document.getElementById("donut");
    const legend = document.getElementById("legend");

    let angle = 0;
    segments.forEach(seg => {
      const sweep = (seg.pct / total) * 360;
      const start = angle + gap / 2;
      const end = angle + sweep - gap / 2;
      angle += sweep;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", arcPath(cx, cy, R, r, start, end));
      path.setAttribute("fill", seg.color);
      svg.appendChild(path);

      // Legend row
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `
        <span class="legend-dot" style="background:${seg.color}"></span>
        <span class="legend-label">${seg.label}</span>
        <span class="legend-pct">${seg.pct}%</span>
      `;
      legend.appendChild(item);
    });

    // Center label
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", cx);
    text.setAttribute("y", cy + 6);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", "15");
    text.setAttribute("font-family", "-apple-system, BlinkMacSystemFont, sans-serif");
    text.setAttribute("fill", "#555");
    text.textContent = `${total}%`;
    svg.appendChild(text);
  </script>
</body>
</html>
